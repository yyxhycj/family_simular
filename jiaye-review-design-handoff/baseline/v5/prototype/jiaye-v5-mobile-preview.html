on personRecord(m,text){m.bio.push({year:state.elapsed,text});}\nfunction addEvent(id,type,data={}){if(!state.events.some(e=\u003ee.id===id))state.events.push({id,type,year:state.elapsed,...data});}\nfunction unlockRelic(id,reason){if(store.profile.unlocked.includes(id))return false;store.profile.unlocked.push(id);store.profile.records.push({id,reason,family:state.family,year:state.elapsed,runId:state.runId});record('解锁','新的开局信物：'+relicDef(id).name,reason+'。以后创建家族时可以选择；不会自动增加到本局家财。',['下局可选 · '+relicDef(id).cost+' 点']);return true;}\nfunction startGame(){const errors=validateDraft();if(errors.length){step=4;render();return toast(errors[0]);}if(state&&!state.ended){showDialog('立下新的家谱？',`\u003cp class=\"help\"\u003e这会替换当前正在经营的${esc(state.family)}家。已解锁的信物与已完成终章保留；V1、V2 存档不受影响。\u003c/p\u003e`,`\u003cbutton class=\"btn\" onclick=\"closeModal()\"\u003e再想想\u003c/button\u003e\u003cbutton class=\"btn primary\" onclick=\"commitStart()\"\u003e开始这一个家族\u003c/button\u003e`);return;}commitStart();}\nfunction commitStart(){const issues=validateDraft();if(issues.length){closeModal();step=4;screen='setup';render();toast(issues[0]);return;}closeModal();state=makeGame(draft);store.profile.runs++;record('开篇',state.family+'家，在这里落脚',`大晟历${state.calendar}年，${by(ERA,state.era).name}。一家${state.members.length}口在${by(PLACES,state.place).short}落脚，带着${state.money}两银钱与${state.grain}石粮。`,['开局 '+totalPoints(draft)+' / '+LIMIT+' 点']);state.members.forEach(m=\u003epersonRecord(m,'开始'+JOBS[m.job].name+'，这份安排会持续保留。'));if(state.relics.length)queueRelic(state.relics[0]);else addEvent('first-settle','settle');screen='game';page='overview';step=0;activeEventChoice=null;save();render();window.scrollTo(0,0);toast('家谱落笔。先看看眼前的家事，再度过这一年。');}\nfunction queueRelic(r){if(!r||r.status==='sold'||r.phase===2)return;const id='relic-'+r.id+'-'+r.phase;if(r.phase===0)addEvent(id,'relicStart',{relic:r.id});else if(r.due!=null&&r.due\u003c=state.elapsed)addEvent(id,'relicFinish',{relic:r.id,actor:r.actor});}\nfunction assignedName(e){return get(e.actor)?.alive?get(e.actor).name:(get(state.leader)?.name||'家人');}\nfunction relicEvent(e){const r=own(e.relic),d=relicDef(e.relic);if(!r)return null;const who=assignedName(e);const starts={\n book:{title:'族谱里空着的一行',body:'整理旧谱时，家人发现中间少了一页。下一页的边角，却写着一个陌生人的小名。或许还有一支亲人，已经很久没有回过家。',source:'来自家传物「一本旧族谱」；不是所有家族都会遇到的开篇。',choices:[['去邻村核对旧记载','花费 6 两；一位族人用一年查访，原有主业不变。',6,'investigate'],['先收好，等日子安稳些','不花费；信物保留，日后可从传家旧物里重新调查。',0,'keep']]},\n ruler:{title:'木尺上的旧刻痕',body:'修补桌脚时，尺背那枚浅浅的匠号又露了出来。镇上的老匠人看过后说：“我年轻时，见过用这把尺的人。旧祠堂里，也许还留着他的图。”',source:'来自家传物「一把老木尺」；保管人留下了这条线索。',choices:[['带着木尺，去旧祠堂问一问','花费 8 两；一年后得到后续，可解锁新的营造图。',8,'investigate'],['请老匠人来家中看一看','花费 4 两；查访需要两年，结局路线相同。',4,'slow'],['先把眼前的日子过好','不花费；随时可以在传家旧物中继续这段寻访。',0,'keep']]},\n letter:{title:'一封迟到的信',body:'家书的封口已经发脆。里面没有银票，只有一句托付：若家里有余力，请去看看江口的故人。那一别，已经过去了很多年。',source:'来自家传物「一封未拆的家书」。',choices:[['照着信上的地址寻人','花费 6 两；一年后带回消息。',6,'investigate'],['先存好这封信','不花费；不丢弃这份承诺，日后再决定。',0,'keep']]},\n plan:{title:'旧图上的新屋',body:'图里的一处梁架，正好能用来修乡里的旧桥。有人提议接下这件事，也有人觉得先把自己的家安顿好更稳妥。',source:'由已解锁信物「修复的营造图」开启的新故事。',choices:[['安排族人试做，接下修桥的活','投入 16 两；一年后获得工钱与声望。',16,'investigate'],['先留着图，不急着接活','本局仍保有图纸带来的收入效果。',0,'keep']]},\n newbook:{title:'远房的一封回信',body:'重修过的族谱传到旁支手里。对方的一位年轻人写信问：能不能回来，跟着家里重新找一份生计？',source:'由「补完的族谱」开启的归家故事。',choices:[['留一间房，请这个后人回来','花费 12 两；一年后有一位成年旁支加入，可独立安排。',12,'investigate'],['先往来书信，暂不迎回','保留后续；本局的真实交接仍获得信物效果。',0,'keep']]},\n jade:{title:'另一半玉佩的下落',body:'集市上的老人认出了玉上的纹样。他说，另一半曾出现在远处的渡口。故事里的亲缘，还需要有人认真核实。',source:'由「故人的半枚玉佩」开启；不会未经核实就自动认亲。',choices:[['带着旧信与玉佩去核对','花费 10 两；一年后查明一段相逢。',10,'investigate'],['不要仓促认亲，先保存线索','不花费；日后可以继续。',0,'keep']]},\n notes:{title:'医案要留给谁看',body:'书页上有许多普通人的名字。家里年轻的医者说，把它印出来，也许能让更多学徒少走一点弯路。',source:'由「批注医案」开启的传习故事。',choices:[['整理成册，交给乡里的学徒','花费 15 两；一年后声望 +12，记录一次公开传授。',15,'investigate'],['先在家里继续验证','不额外花费；仍保留学医增益，日后可以刊印。',0,'keep']]}\n };\n const finishes={\n book:{title:'那一页，并不是遗失了',body:`${who}找到两份旧簿。原来那位族人曾因分家离开，后人连他的名字也不再写入。如今去核实，旁支仍记得这个姓氏。`,choices:[['把名字补回去，重修这本家谱','不花银钱；声望 +5；解锁「补完的族谱」，本局旧谱保留。',0,'complete'],['记下真相，但先不重修','完成查访并保存事实；不解锁补完的族谱。',0,'archive']]},\n ruler:{title:'那张旧图，终于找到了',body:`${who}带回一卷残图。老匠人认出，尺上的缺口正好对应图中的特殊刻度。它不是宝藏，却足以教下一代把一间屋子修得更稳。`,choices:[['修复图纸，把本事留给后人','再花 8 两；手艺 +6；解锁「修复的营造图」。',8,'complete'],['把旧图交给当地的匠人','声望 +6；完成寻访，不解锁家传营造图。',0,'share']]},\n letter:{title:'收信的人不在了，家还在',body:`${who}找到了那处老门。故人已经离世，他的孙辈却还记得祖父说过：有一家人，答应总有一天会来看一看。`,choices:[['替前人把约定做完','再花 6 两接济；声望 +6；解锁「故人的半枚玉佩」。',6,'complete'],['留下家书，彼此记住这个来处','声望 +3；完成送信，不获得玉佩。',0,'share']]},\n plan:{title:'桥上，又有人来往了',body:'新梁架起以后，过河的人终于不必再绕远路。工钱如约送到，图纸上也多了这次的经验。',choices:[['收好工钱，把修造记进家谱','获得 40 两、声望 +6；记下营造传习。',0,'complete']]},\n newbook:{title:'家谱里的名字，走进了门',body:'年轻的旁支带着一个小包袱来了。他没有许诺远大的前程，只说愿意从眼前的活计学起。',choices:[['安排住下，从此一起过日子','一位 22 岁成年成员加入；仍可单独安排、担任族长。',0,'complete']]},\n jade:{title:'玉佩合上，旧事也有了着落',body:'两半纹样确实相合，旧信与当地记载也能对应。对方不是失散的近亲，而是曾经互相救助的两家人的后辈。',choices:[['往后仍做彼此的故人','声望 +8；记录一段经过核实的家族来往。',0,'complete']]},\n notes:{title:'新的批注，来自别人家',body:'第一批学徒把书送回来，边角多了新的疑问与补充。一本家里的医案，开始容纳更多人的经验。',choices:[['收好回信，继续传授','声望 +12；记录公开医案事件。',0,'complete']]}\n };\n const data=e.type==='relicStart'?starts[r.id]:finishes[r.id];return {...data,source:data.source||'信物后续 · '+d.name,choices:data.choices.map(x=\u003e({label:x[0],desc:x[1],money:x[2],action:x[3]})),actorSelectable:e.type==='relicStart',actor:e.actor||r.custodian};\n}\nfunction eventData(e=state?.events[0]){if(!e)return null;if(e.type.startsWith('relic'))return relicEvent(e);const m=get(e.target);const n=m?.name||'家里的孩子';const map={\n settle:{title:'先把日子安顿下来',body:'行李还堆在屋角，家里已经开始盘算接下来的生计。邻人带来几份消息：有人招工，有人收学徒，田里的活也快忙起来了。',source:'家族开篇 · 每个人的长期安排都可以随时调整。',choices:[{label:'按眼下的安排开始生活',desc:'不花费；继续当前安排。',action:'continue',money:0},{label:'拿出一点粮，与邻里吃顿饭',desc:'存粮 −4 石；声望 +3。',action:'neighbor',grain:4}]},\n aid:{title:'邻人敲响了门',body:'这年收成不好，邻人想借几袋粮撑过眼前。他没有说一定什么时候还，只说等日子好一点，会记得这一回。',source:'乡里往来 · 来自这一年的家族事件。',choices:[{label:'拿出六石粮，帮这一回',desc:'存粮 −6 石；声望 +6，记下一次实际援助。',grain:6,action:'aid'},{label:'给十两银，先让人安顿下来',desc:'银钱 −10 两；声望 +6，记下一次实际援助。',money:10,action:'aid'},{label:'先顾好自家，婉言说明',desc:'资源不变，不记录援助。',money:0,action:'decline'}]},\n roof:{title:'屋檐下接了几只盆',body:'昨夜下雨，屋里漏了水。孩子觉得有趣，大人却知道，等下一场雨来时，最好已经补好了。',source:'家宅日常 · 可以花钱修，也可以先由家人补漏。',choices:[{label:'请匠人把破损处修好',desc:'银钱 −12 两；全家体魄 +3。',money:12,action:'repair'},{label:'先由家里人补住漏处',desc:'不额外花钱；本次不增加体魄。',money:0,action:'decline'}]},\n school:{title:n+'想多读一些书',body:`${n}读完了手边的旧书，又向先生借了两本。先生捎话说，孩子学得认真，但添置纸笔还需要家里帮一把。`,source:'来自持续读书的安排 · '+n,choices:[{label:'再添些书与纸笔',desc:'银钱 −8 两；这个孩子的学识 +6。',money:8,action:'books'},{label:'按原来的进度来，不急于加课',desc:'现有读书安排继续，不增加额外支出。',money:0,action:'decline'}]},\n graduate:{title:n+'已经可以独立谋生了',body:`师父说，${n}学的这些本领，已经足以接下日常的活计。是继续跟着学，还是开始谋生，仍由家里商量。`,source:'来自学徒成长 · 达标不等于自动替你转行。',choices:[{label:'开始靠本领谋生',desc:'下一年起改为'+(e.job==='doctor'?'行医问诊':e.job==='guard'?'担任护卫':'手艺谋生')+'。',money:0,action:'graduate'},{label:'先再学一阵，暂不转行',desc:'原安排保留；以后仍可从人物页直接调整。',money:0,action:'decline'}]},\n medicalFind:{title:'医馆赠来一本批注',body:'这些年在乡里问诊，家里人始终把经验认真记下。医馆的老先生送来自己的批注，说这些东西值得有人接着整理。',source:'来自本局累计行医与医术成长。',choices:[{label:'收好医案，留给后来的学徒',desc:'获得本局物件「批注医案」，并解锁为未来开局选项。',money:0,action:'medicalFind'}]}\n };return map[e.type]||null;}\nfunction affordable(o){return state.money\u003e=(o.money||0)&&state.grain\u003e=(o.grain||0);}\nfunction chooseEvent(i){activeEventChoice=i;const el=$('#decision');if(el)el.outerHTML=decisionView();}\nfunction chooseActor(id){if(state.events[0])state.events[0].actor=Number(id);save();}\nfunction resolveEvent(expected){const e=state.events[0];if(!e||e.id!==expected||state.ended||activeEventChoice==null)return;const data=eventData(e),o=data?.choices[activeEventChoice];if(!o||!affordable(o))return toast('家里的储备还不够，可以选择另一种处理方式。');\n if(data.actorSelectable&&o.action!=='keep'&&!adults().length)return toast('这件事需要一位成年族人来办，孩子长大后仍可继续。');\n state.money-=o.money||0;state.grain-=o.grain||0;const effects=[];if(o.money)effects.push('银钱 −'+o.money+' 两');if(o.grain)effects.push('存粮 −'+o.grain+' 石');let body=o.label+'。';const m=get(e.target);\n if(e.type.startsWith('relic')){const r=own(e.relic);if(!r)return;r.history.push({year:state.elapsed,text:o.label});\n if(e.type==='relicStart'){if(o.action==='keep'){r.phase=0;body='物件被仔细收好。你可以从「传家旧物」里重新展开这条线索。';r.deferred=true;}else{r.phase=1;r.due=state.elapsed+(o.action==='slow'?2:1);r.actor=adults().some(x=\u003ex.id===e.actor)?e.actor:(get(r.custodian)?.alive&&get(r.custodian).age\u003e=18?r.custodian:adults()[0].id);r.route=o.action;body=get(r.actor).name+'接下了这件事。原有主业保持不变，预计第 '+(r.due+1)+' 年得到后续。';effects.push('调查进行中');personRecord(get(r.actor),'开始调查「'+relicDef(r.id).name+'」留下的线索。');}}\n else{r.phase=2;r.due=null;state.flags[r.id+'Complete']=true;const actor=get(r.actor)?.alive?get(r.actor):adults()[0];\n if(r.id==='ruler'&&o.action==='complete'){if(actor){actor.skill=clamp(actor.skill+6,0,100);effects.push(actor.name+'手艺 +6');}unlockRelic('plan','修复了老木尺指向的营造图');state.flags.rulerRestored=true;body='图纸被重新抄好，木尺也留在家里。这段手艺有了可供后人追寻的来处。';}else if(r.id==='ruler'){state.reputation+=6;body='旧图交给了当地的匠人，这份手艺会以另一种方式留下。';}\n if(r.id==='book'&&o.action==='complete'){unlockRelic('newbook','找回旧谱里被遗漏的亲族，重修记载');state.reputation+=5;state.flags.bookRestored=true;body='那个名字重新写回家谱。后人可以知道，分开生活不等于从未属于这个家。';}\n if(r.id==='letter'&&o.action==='complete'){unlockRelic('jade','把旧家书送到故人后辈手中，完成了前人的约定');state.reputation+=6;state.flags.promiseKept=true;body='对方送来半枚玉佩，作为这次相逢的见证。它成为以后可选的新开局信物，本局家书的故事已完成。';}else if(r.id==='letter')state.reputation+=3;\n if(r.id==='plan'){state.money+=40;state.reputation+=6;state.flags.bridge=true;effects.push('银钱 +40 两','声望 +6');}\n if(r.id==='newbook'){addRelative('reunion');effects.push('成年旁支 +1');}\n if(r.id==='jade'){state.reputation+=8;effects.push('声望 +8');}\n if(r.id==='notes'){state.reputation+=12;state.flags.publicNotes=true;effects.push('声望 +12');}\n r.history.push({year:state.elapsed,text:body});if(actor)personRecord(actor,'完成了「'+relicDef(r.id).name+'」的这段故事。');}}\n else if(o.action==='aid'){state.metrics.aid++;state.reputation+=6+(state.config.tie==='neighbor'?2:0);body='东西交到了邻人手里。家里确实付出过的这一回，会留在乡里的记忆中。';effects.push('记录援助 +1');}\n else if(o.action==='neighbor'){state.reputation+=3;body='一顿饭，让彼此知道了名字。';}\n else if(o.action==='repair'){living().forEach(x=\u003ex.health=clamp(x.health+3,0,100));effects.push('全家体魄 +3');body='雨再来时，屋里终于不用放盆了。';}\n else if(o.action==='books'&&m?.alive){m.learn=clamp(m.learn+6,0,100);personRecord(m,'家里添置纸笔，支持继续求学。');effects.push(m.name+'学识 +6');}\n else if(o.action==='graduate'&&m?.alive&&candidateHasJob(m,e.job)){setMemberJob(m,e.job);body=m.name+'开始'+JOBS[e.job].name+'，下一次年度结算生效。';}\n else if(o.action==='medicalFind'){if(!own('notes'))state.relics.push({id:'notes',custodian:m?.alive?m.id:state.leader,status:'owned',phase:0,due:null,history:[{year:state.elapsed,text:'在行医的积累中，得到一份批注医案。'}]});unlockRelic('notes','累计行医六人年，并把一位在世医者培养到医术 55');body='医案交给了家里。它可以在本局继续研究，也成为未来开局的新选择。';}\n state.reputation=clamp(state.reputation,0,100);record(e.type.startsWith('relic')?'信物':'决定',data.title,body,effects);state.events.shift();activeEventChoice=null;state.lastDecision={title:data.title,body,effects};save();render();toast(store.profile.unlocked.length\u003e3&&e.type==='relicFinish'?'后续已写进年鉴，可到信物藏阁查看解锁。':'决定已经记下，家里的日子继续。');}\nfunction skillGain(m,j){let gain=j.gain||0;if(!gain)return 0;const c=state.config,p=by(PLACES,state.place);if(['study','apprentice','medical','train'].includes(m.job)){gain+=TALENTS[m.talent-1].gain;if(m.focus===j.stat)gain+=2;}if(m.job==='study'){gain+=(c.origin==='scholar'?2:0)+(c.habit==='education'?1:0)+(c.tie==='teacher'?1:0)+(p.study||0);}if(['craft','apprentice'].includes(m.job)&&c.origin==='artisan')gain++;if(m.job==='apprentice'&&own('ruler'))gain++;if(m.job==='medical'){if(c.tie==='healer')gain++;if(own('notes'))gain+=2;}if(m.job==='train'&&c.origin==='military')gain+=2;return Math.max(1,gain);}\nfunction handovers(){return state.leaders.filter((l,i)=\u003ei\u003cstate.leaders.length-1&&l.end!=null&&l.end-l.start\u003e=1).length;}\nfunction jobTotal(k){return state.members.reduce((s,m)=\u003es+(m.jobYears[k]||0),0);}\nfunction jobGenerations(k,min=2){return new Set(state.members.filter(m=\u003e(m.jobYears[k]||0)\u003e=min).map(m=\u003em.gen)).size;}\nfunction setMemberJob(m,k){const old=m.job;m.job=k;if((m.jobYears.guard||0)\u003e=3&&['home','farm','rest'].includes(k))m.hadHomeAfterGuard=true;personRecord(m,'从'+JOBS[old].name+'改为'+JOBS[k].name+'。');record('安排',m.name+'有了新的安排',`你让${m.name}从${JOBS[old].name}改为${JOBS[k].name}。没有改变配偶、亲属关系或已经发生的经历。`,['下次年度结算生效']);}\nfunction advanceYear(){if(state.ended)return showConclusion();if(state.events.length){page='overview';render();$('#decision')?.scrollIntoView({block:'center',behavior:'smooth'});return toast('先给眼前的家事一个答复。');}if((!get(state.leader)?.alive)&&adults().length)return openLeader();\n const b=estimate(state),beforeMoney=state.money,beforeGrain=state.grain,liveBefore=living().slice(),from=state.elapsed;state.elapsed++;state.lastDecision=null;state.money+=b.rawMoney;state.grain+=b.grainNet;let shortage=false,foodPurchased=0;\n if(state.money\u003c0&&state.grain\u003e0){const sell=Math.min(Math.floor(state.grain),Math.ceil(-state.money/Math.max(1,b.foodPrice-1)));state.grain-=sell;state.money+=sell*Math.max(1,b.foodPrice-1);record('生计','卖出一些粮，接上开支',`银钱不足，家里卖出${sell}石粮。不是新增收入，而是把已有储备换成了银钱。`,['存粮 −'+sell]);}\n if(state.grain\u003c0){foodPurchased=Math.min(-state.grain,Math.floor(Math.max(0,state.money)/b.foodPrice));state.money-=foodPurchased*b.foodPrice;state.grain+=foodPurchased;if(foodPurchased)record('生计','从市集买回口粮',`这一年自产不足，花${foodPurchased*b.foodPrice}两买回${foodPurchased}石粮。`,[]);}\n if(state.money\u003c0||state.grain\u003c0){shortage=true;state.metrics.hardship++;state.money=Math.max(0,state.money);state.grain=Math.max(0,state.grain);liveBefore.forEach(m=\u003em.health-=12);record('困境','日子紧了，先把生计接上','储备不足，大家省着过日子。族长仍可换，生计仍能调整；这不是家族终局。',['全家体魄 −12']);}\n state.metrics.stable=shortage?0:state.metrics.stable+1;state.metrics.foodYears=shortage?0:state.metrics.foodYears+1;if(state.metrics.hardship&&state.metrics.stable\u003e=3)state.metrics.recovered=true;\n const hasCarer=liveBefore.some(m=\u003em.job==='home'),home=state.home;let deaths=0;\n for(const m of liveBefore){const j=JOBS[m.job];m.jobYears[m.job]=(m.jobYears[m.job]||0)+1;if(j.stat)m[j.stat]=clamp(m[j.stat]+skillGain(m,j),0,100);m.age++;if(hasCarer)m.health++;if(m.job==='rest')m.health+=5+(state.config.habit==='care'?2:0)+(home==='courtyard'?1:home==='estate'?2:0);if(m.age\u003e=55)m.health-=m.age\u003e=70?5:2;else if(m.job==='guard')m.health-=2;m.health=clamp(m.health,0,100);if(m.job==='official')state.reputation++;\n if(m.age===18){personRecord(m,'成年，可以接受新的谋生安排，也可以成为族长候选。');record('成长',m.name+'成年了','这个人仍有自己的人生；是否接手家里的事情，由你决定。',['可任族长']);}\n if(m.job==='play'&&m.age\u003e=12){m.job='rest';record('成长',m.name+'渐渐长大','暂时继续在家休息，未自动增加学费。可以从人物页选择读书或学艺。',[]);}\n if(m.health\u003c=0||m.age\u003e=m.lifespan){m.alive=false;m.deathYear=state.elapsed;deaths++;personRecord(m,'在这一年离世，享年 '+m.age+' 岁。');record('离别',m.name+'的这一生，写完了','家人把留下来的东西仔细收好。这个人的经历会一直保留在家谱中。',[]);if(state.leader===m.id){state.leaders.at(-1).end=state.elapsed;state.leader=null;}state.relics.filter(r=\u003er.custodian===m.id&&r.status!=='sold').forEach(r=\u003e{r.custodian=null;r.history.push({year:state.elapsed,text:'保管人离世，物件收回家中，等待重新托付。'});});}\n }\n record('岁计','第'+(from+1)+'年的家计',`生产所得 ${b.income} 两，求学学艺 ${b.training} 两，日常开支 ${b.upkeep} 两。粮食产出 ${b.grainEarn} 石，日常吃用 ${b.eat} 石。`,['银钱 '+signed(state.money-beforeMoney)+' 两','存粮 '+signed(state.grain-beforeGrain)+' 石']);\n // A generation continues through living people, not a particular leader or surname line.\n if(!living().length){state.lastSummary={money:state.money-beforeMoney,grain:state.grain-beforeGrain,deaths};finishRun('last');return;}\n for(const m of living()){let graduation=null;if(m.job==='apprentice'&&m.skill\u003e=35&&m.age\u003e=18)graduation='craft';if(m.job==='medical'&&m.medicine\u003e=40&&m.age\u003e=18)graduation= indow.scrollTo(0,0);if(!get(state.leader)?.alive&&adults().length)openLeader();else toast('来到第 '+(state.elapsed+1)+' 年。'+(state.events.length?'有些事情已经有了后文。':'每个人都按原来的安排继续生活。'));}\nfunction newGameMember(o){const id=state.nextId++;return {...rawPerson({id,name:state.family+'知禾',age:22,talent:2,experience:'basic',job:'farm'}),learn:25,skill:25,medicine:0,trade:10,martial:10,gen:1,alive:true,health:92,jobYears:{},bio:[],examPassed:false,deathYear:null,birthPlan:true,lastBirth:-5,lifespan:79+Math.floor(rnd()*13),...o,id};}\nfunction addBaby(mom,dad){const suffix=['知禾','予安','明川','小满','望舒','怀青','景宁','知秋'][state.nextId%8];let name=state.family+suffix;if(state.members.some(m=\u003em.name===name))name+=String(state.nextId);const child=newGameMember({name,sex:rnd()\u003c.5?'女':'男',age:0,parents:[mom.id,dad.id],gen:Math.max(mom.gen,dad.gen)+1,talent:1+Math.floor(rnd()*4),experience:'none',job:'play',learn:0,skill:0,trade:0,martial:0,medicine:0,spouse:null});child.bio=[{year:state.elapsed,text:'出生在这个家里，家谱添上新的一行。'}];state.members.push(child);mom.lastBirth=state.elapsed;dad.lastBirth=state.elapsed;personRecord(mom,name+'出生。');personRecord(dad,name+'出生。');record('新生','家里多了一个孩子：'+name,mom.name+'与'+dad.name+'迎来了下一代。孩子独立入谱，成长后可单独安排人生。',['人口 +1']);}\nfunction addRelative(kind){const child=kind==='adopt';const l=child?(adults().find(m=\u003em.age\u003e=24)||get(state.leader)||living()[0]):(get(state.leader)||living()[0]);const m=newGameMember({name:state.family+(child?'念安':'怀远')+state.nextId,age:child?6:22,sex:rnd()\u003c.5?'女':'男',parents:child?[l.id]:[],gen:child?l.gen+1:Math.max(1,l.gen),job:child?'study':'farm',learn:child?5:25,skill:child?0:25,role:child?'收养的孩子':'归来的成年旁支',originGen:child?null:Math.max(1,l.gen)});m.bio=[{year:state.elapsed,text:child?'在成年家人的照料下加入家族。':'循着旧谱回到家里，成为可以单独安排的成员。'}];state.members.push(m);if(child)state.metrics.adoptions++;record(child?'收养':'团聚',m.name+'加入这个家','从此，家谱中多了一段独立的人生。',['人口 +1']);return m;}\nconst ENDINGS=[\n {id:'peaceful',title:'炊烟未断',category:' 03e\u003cspan\u003e${g.value}\u003c/span\u003e\u003c/div\u003e`).join('')}\u003c/div\u003e\u003cdiv class=\"budget-rule\"\u003e想要更好的来历，还是更多的家人？\u003cbr\u003e怎么取舍，由你决定。\u003cdiv style=\"margin-top:10px\"\u003e\u003cbutton class=\"text-btn\" onclick=\"openPriceDetail()\"\u003e逐项查看点数明细 ↗\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"family-preview\"\u003e\u003cspan class=\"small muted\"\u003e这本家谱的第一页\u003c/span\u003e\u003ch3\u003e${esc(draft.family||'未名')}氏家族\u003c/h3\u003e\u003cp\u003e${by(ORIGINS,draft.origin).name}出身，在${by(PLACES,draft.place).short}落脚。${draft.members.length}位家人，带着${draft.money}两银钱，从自己的日子开始。\u003c/p\u003e\u003cdiv class=\"mini-pairs\"\u003e\u003cspan\u003e首任族长\u003c/span\u003e\u003cb\u003e${esc(leader?.name||'尚未选择')}\u003c/b\u003e\u003cspan\u003e初始成员\u003c/span\u003e\u003cb\u003e${draft.members.filter(m=\u003em.age\u003e=18).length}位成年 · ${draft.members.filter(m=\u003em.age\u003c18).length}位孩子\u003c/b\u003e\u003cspan\u003e首年银钱预计\u003c/span\u003e\u003cb class=\"${(economy?.money||0)\u003e=0?'positive':'negative'}\"\u003e${economy?signed(economy.money)+' 两':'待完善安排'}\u003c/b\u003e\u003cspan\u003e开局信物\u003c/span\u003e\u003cb\u003e${draft.relics.length} 件\u003c/b\u003e\u003c/div\u003e\u003c/section\u003e`;}\nfunction setupView(){return `${worldHeader('setup')}\u003cdiv class=\"v3-setup\"\u003e\u003caside class=\"setup-left\"\u003e\u003cdiv class=\"nav-kicker\"\u003e创建一个家族\u003c/div\u003e${STEP_NAMES.map((s,i)=\u003e`\u003cbutton class=\"step-link ${step===i?'active':''}\" onclick=\"goStep(${i})\" ${step===i?'aria-current=\"step\"':''}\u003e\u003cspan\u003e0${i+1}\u003c/span\u003e\u003cdiv\u003e${s[0]}\u003csmall\u003e${s[1]}\u003c/small\u003e\u003c/div\u003e\u003c/button\u003e`).join('')}\u003cblockquote\u003e开局不是命定的一生。\u003cbr\u003e只是决定，\u003cbr\u003e从哪里开始。\u003c/blockquote\u003e\u003c/aside\u003e\u003cmain class=\"v3-center\" id=\"setup-content\"\u003e\u003cdiv class=\"eyebrow\"\u003e凡世王朝 · 开篇 ${String(step+1).padStart(2,'0')} / 05\u003c/div\u003e${[setupWorld,setupPeople,setupAssets,setupRelics,setupReview][step]()}\u003c/main\u003e\u003caside class=\"budget-side\" id=\"budget-side\"\u003e${renderBudget()}\u003c/aside\u003e\u003c/div\u003e${setupFooter()}`;}\nfunction setupFooter(){const total=totalPoints(),over=total\u003eLIMIT,errors=step===4?validateDraft():[];return `\u003cfooter class=\"create-footer\" id=\"create-footer\"\u003e\u003cdiv class=\"points-footer\"\u003e\u003cstrong class=\"${over?'negative':''}\"\u003e${over?'+':''}${over?round(total-LIMIT):round(LIMIT-total)}\u003c/strong\u003e\u003cp\u003e${over?'超出的点数':'剩余点数'}\u003cbr\u003e${over?'不会自动改动你的选择':'总分 '+LIMIT+' · 不设分类配额'}\u003c/p\u003e\u003c/div\u003e\u003cspan class=\"footer-hint\"\u003e${step===4?'开局后点数不再限制家族的发展。':'修改只保存在开局草案中。'}\u003c/span\u003e\u003cdiv class=\"row\"\u003e${step?`\u003cbutton class=\"btn\" onclick=\"goStep(${step-1})\"\u003e上一步\u003c/button\u003e`:''}${step\u003c4?`\u003cbutton class=\"btn primary\" onclick=\"goStep(${step+1})\"\u003e${['安排家中这些人','安排安身家底','挑选家传旧物','看看这一家'][step]} →\u003c/button\u003e`:`\u003cbutton id=\"start-game\" class=\"btn primary\" onclick=\"startGame()\" ${errors.length?'disabled':''}\u003e立下家谱，开始 →\u003c/button\u003e`}\u003c/div\u003e\u003c/footer\u003e`;}\nfunction optionCards(key,options,cls=''){return `\u003cdiv class=\"option-grid ${cls}\"\u003e${options.map(o=\u003e`\u003cbutton class=\"option-card ${draft[key]===o.id?'chosen':''}\" onclick=\"setChoice('${key}','${o.id}')\" aria-pressed=\"${draft[key]===o.id}\" data-option=\"${key}-${o.id}\"\u003e\u003cdiv class=\"between\"\u003e\u003cstrong\u003e${esc(o.name)}\u003c/strong\u003e\u003cdiv class=\"cost-selected\"\u003e\u003cspan class=\"price\"\u003e${o.cost} 点\u003c/span\u003e\u003cspan class=\"select-dot\"\u003e✓\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003cp\u003e${esc(o.desc)}\u003c/p\u003e${o.effect?`\u003cdiv class=\"option-effect\"\u003e${esc(o.effect)}\u003c/div\u003e`:''}\u003c/button\u003e`).join('')}\u003c/div\u003e`;}\nfunction setupWorld(){return `\u003ch1 class=\"page-title\"\u003e这一家，从怎样的日子开始？\u003c/h1\u003e\u003cp class=\"intro-copy\"\u003e选一个世道，再选一段来历。它们影响起点，不替你决定后来的路。\u003c/p\u003e\u003cdiv class=\"world-ribbon\"\u003e\u003cdiv\u003e\u003cstrong\u003e凡世王朝 · 大晟\u003c/strong\u003e\u003cp\u003e普通人的一生，与几代人的家业。无修炼、无超自然延寿。\u003c/p\u003e\u003c/div\u003e\u003cbutton class=\"text-btn\" onclick=\"showWorld()\"\u003e了解这个世界 ↗\u003c/button\u003e\u003c/div\u003e\u003cdiv class=\"field-line\"\u003e\u003clabel class=\"field\"\u003e家族姓氏 · 不计分\u003cinput id=\"family-name\" maxlength=\"6\" value=\"${esc(draft.family)}\" oninput=\"setFamilyName(this.value)\" placeholder=\"例如：林、沈、司徒\"\u003e\u003c/label\u003e\u003clabel class=\"field\"\u003e开局时间 · 不计分\u003cinput id=\"calendar-year\" type=\"number\" min=\"1\" max=\"9999\" value=\"${draft.calendar}\" onchange=\"setNumber('calendar',this.value,1,1,9999)\"\u003e\u003csmall\u003e大晟历年份；不会增加本局经营年数。\u003c/small\u003e\u003c/label\u003e\u003c/div\u003e${sectionTitle('生在怎样的时世','每项独立计分；时代以后可能变化')}${optionCards('era',ERA)}${sectionTitle('这个家的来处','只包含写明的效果，不附送人口与家财')}${optionCards('origin',ORIGINS,'origin-grid')}${sectionTitle('在哪一处落脚','选择地区不改变其他配置')}${optionCards('place',PLACES)}\u003cdiv class=\"inline-hint\"\u003e寒门也可以有钱，名门也可以只剩几个人。只要总分不超出，这样的家族同样能开始。\u003c/div\u003e`;}\nfunction draftRelation(m){const ps=m.parents.map(id=\u003edraft.members.find(x=\u003ex.id===id)?.name).filter(Boolean);const sp=draft.members.find(x=\u003ex.id===m.spouse);return [ps.length?'父母／养亲：'+ps.join('、'):'本家成员 · 未设上代',sp?'配偶：'+sp.name:''].filter(Boolean).join('　·　');}\nfunction setupPeople(){const adult=draft.members.filter(m=\u003em.age\u003e=18).length;return `\u003ch1 class=\"page-title\"\u003e一个家，由这些人开始。\u003c/h1\u003e\u003cp class=\"intro-copy\"\u003e每个人都能单独设定。人数、资质与已有本领分别计分，只有一个共同预算。\u003c/p\u003e\u003cdiv class=\"family-meta\"\u003e\u003cdiv class=\"mini-stat\"\u003e\u003cspan\u003e入谱人数\u003c/span\u003e\u003cstrong\u003e${draft.members.length}\u003csmall style=\"font:11px var(--sans)\"\u003e 人\u003c/small\u003e\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini-stat\"\u003e\u003cspan\u003e成年族人\u003c/span\u003e\u003cstrong\u003e${adult}\u003csmall style=\"font:11px var(--sans)\"\u003e 人\u003c/small\u003e\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"mini-stat\"\u003e\u003cspan\u003e成员总分\u003c/span\u003e\u003cstrong\u003e${pointGroups().filter(g=\u003e['population','talent','experience'].includes(g.id)).reduce((s,g)=\u003es+g.value,0)}\u003csmall style=\"font:11px var(--sans)\"\u003e 点\u003c/small\u003e\u003c/strong\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"roster-create\"\u003e${draft.members.map(m=\u003e{const p=memberPoints(m);return `\u003carticle class=\"draft-person\"\u003e\u003cdiv class=\"name-stamp\"\u003e${esc(m.name.slice(-1))}\u003c/div\u003e\u003cdiv\u003e\u003ch3\u003e${esc(m.name)}${draft.leader===m.id?tag('首任族长','red'):''}\u003c/h3\u003e\u003cdiv class=\"byline\"\u003e${m.age}岁 · ${esc(m.sex)} · ${esc(draftRelation(m))}\u003c/div\u003e\u003cdiv class=\"person-bottom\"\u003e${TALENTS[m.talent-1].name}资质 · ${FOCUSES[m.focus]} · ${by(EXPERIENCES,m.experience).name}\u003cbr\u003e初始安排：${JOBS[m.job]?.name||'尚未选择'}\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"person-actions\"\u003e\u003cspan class=\"price\"\u003e${p.population+p.talent+p.experience} 点\u003c/span\u003e\u003cbutton class=\"text-btn\" onclick=\"openDraftPerson(${m.id})\"\u003e编辑这个人 ↗\u003c/button\u003e${draft.leader!==m.id&&m.age\u003e=18?`\u003cbr\u003e\u003cbutton class=\"text-btn\" onclick=\"draftLeader(${m.id})\"\u003e选为族长\u003c/button\u003e`:''}\u003c/div\u003e\u003c/article\u003e`}).join('')}\u003c/div\u003e\u003cdiv class=\"add-person\"\u003e\u003cp class=\"small-note\"\u003e没有固定的人数套餐。增加或移除成员，不改动其他人的资质与本领。\u003c/p\u003e\u003cbutton class=\"btn small\" onclick=\"addDraftPerson()\"\u003e＋ 添一位家人\u003c/button\u003e\u003c/div\u003e${sectionTitle('人数的分数怎么算','仅代表起点条件，不给人物价值分级')}\u003cdiv class=\"notice\"\u003e0—17 岁：每人 4 点。18—54 岁：每人 8 点。55—92 岁：每人 6 点。\u003cbr\u003e资质与本领另行加总；名字、性别、亲属关系、首任族长不额外收费。\u003c/div\u003e\u003cdiv class=\"inline-hint\"\u003e至少留一位成年成员主持开局。父母或养亲与孩子的年龄需要相差至少 18 岁；这些是关系校验，不是配点配额。\u003c/div\u003e`;}\nfunction resourceStepper(key,title,unit,increment,unitCost,desc){return `\u003cdiv class=\"resource-row\"\u003e\u003cdiv\u003e\u003ch3\u003e${title}\u003c/h3\u003e\u003cp\u003e${desc}\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"stepper\"\u003e\u003cbutton aria-label=\"减少${title}\" onclick=\"changeResource('${key}',-${increment})\"\u003e−\u003c/button\u003e\u003cinput aria-label=\"${title}数量\" type=\"number\" min=\"0\" step=\"${increment}\" value=\"${draft[key]}\" onchange=\"setNumber('${key}',this.value,${increment},0,100000)\"\u003e\u003cbutton aria-label=\"增加${title}\" onclick=\"changeResource('${key}',${increment})\"\u003e＋\u003c/button\u003e\u003c/div\u003e\u003cspan class=\"price\"\u003e${round(draft[key]/increment*unitCost)} 点\u003c/span\u003e\u003c/div\u003e`;}\nfunction setupAssets(){return `\u003ch1 class=\"page-title\"\u003e给日子，留一点本钱。\u003c/h1\u003e\u003cp class=\"intro-copy\"\u003e来历与家底分别选择。可以富而人少，也可以人多而清贫，没有“必须平衡”的规则。\u003c/p\u003e\u003csection class=\"panel\" style=\"padding:21px\"\u003e${resourceStepper('money','手中现银','两',10,1,'每 10 两 1 点；求学、治病和日常开支都从这里来。')}${resourceStepper('grain','储备粮食','石',4,1,'每 4 石 1 点；成年人每年吃用 2 石，孩子 1 石。')}${resourceStepper('land','自家田地','亩',1,4,'每亩 4 点；每年额外收粮 4 石，属于共同家业。')}\u003c/section\u003e${sectionTitle('住在哪里','住宅是独立项目，不随出身自动赠送')}${optionCards('home',HOMES)}${sectionTitle('是否已有产业','没有也能靠个人主业谋生，以后可以置办')}\u003cdiv class=\"option-grid\"\u003e${[['workshop','一间木工作坊',14,'有族人从事手艺谋生时，每年额外收入 8 两。'],['shop','一间小商铺',20,'有族人外出经商时，每年额外收入 10 两。']].map(x=\u003e`\u003cbutton class=\"option-card ${draft[x[0]]?'chosen':''}\" onclick=\"setToggle('${x[0]}')\" aria-pressed=\"${draft[x[0]]}\"\u003e\u003cdiv class=\"between\"\u003e\u003cstrong\u003e${x[1]}\u003c/strong\u003e\u003cspan class=\"price\"\u003e${x[2]} 点 ${draft[x[0]]?'✓':''}\u003c/span\u003e\u003c/div\u003e\u003cp\u003e${x[3]}\u003c/p\u003e\u003c/button\u003e`).join('')}\u003c/div\u003e${sectionTitle('家中相处的习惯','共同生活的偏向，不改写每个人的性格')}${optionCards('habit',HABITS)}${sectionTitle('可往来的人','所有具体效果都写在选项里')}${optionCards('tie',TIES)}`;}\nfunction relicCard(r,context='setup'){const unlocked=store.profile.unlocked.includes(r.id),chosen=draft.relics.includes(r.id);return `\u003carticle class=\"panel relic-choice ${!unlocked?'locked':''} ${context==='setup'&&chosen?'option-card chosen':''}\"\u003e\u003cdiv class=\"between\"\u003e\u003cdiv class=\"mark\"\u003e${esc(r.mark)}\u003c/div\u003e\u003cspan class=\"price\"\u003e${unlocked?(r.cost+' 点'):'尚未解锁'}\u003c/span\u003e\u003c/div\u003e\u003ch3\u003e${esc(r.name)}\u003c/h3\u003e\u003cdiv class=\"relic-type\"\u003e${esc(r.type)}${r.base?' · 初始可选':''}\u003c/div\u003e\u003cp\u003e${esc(r.desc)}\u003c/p\u003e\u003cdiv class=\"relic-condition\"\u003e${unlocked?esc(r.effect):'解锁线索：'+esc(r.clue)}\u003c/div\u003e\u003cdiv class=\"relic-options\"\u003e\u003cbutton class=\"text-btn\" onclick=\"openCollectionRelic('${r.id}')\"\u003e${unlocked?'查看故事入口':'看看解锁线索'} ↗\u003c/button\u003e${context==='setup'?`\u003cbutton class=\"btn small ${chosen?'soft':''}\" onclick=\"toggleRelic('${r.id}')\" ${!unlocked?'disabled':''}\u003e${chosen?'✓ 已带入，可移除':'选择带入'}\u003c/button\u003e`:tag(unlocked?'已解锁':'待发现',unlocked?'green':'outline')}\u003c/div\u003e\u003c/article\u003e`;}\nfunction setupRelics(){return `\u003ch1 class=\"page-title\"\u003e带上哪一段旧故事？\u003c/h1\u003e\u003cp class=\"intro-copy\"\u003e现在有 ${store.profile.unlocked.length} 件信物可选。解锁的是开局资格；本局带入哪些，仍由你分配点数。\u003c/p\u003e\u003cdiv class=\"notice\" style=\"margin-bottom:20px\"\u003e可以不带，也可以带多件；不另设信物名额。每件信物的点数，与来历、人数、家底共用这 ${LIMIT} 点。\u003c/div\u003e${sectionTitle('已经可以带入','不同物件，带来不同的事件') }\u003cdiv class=\"option-grid relic-grid\"\u003e${RELICS.filter(r=\u003estore.profile.unlocked.includes(r.id)).map(r=\u003erelicCard(r)).join('')}\u003c/div\u003e${sectionTitle('以后，家里还会留下什么','完成相关经历，才能解锁为新的开局选择')}\u003cdiv class=\"option-grid relic-grid\"\u003e${RELICS.filter(r=\u003e!store.profile.unlocked.includes(r.id)).map(r=\u003erelicCard(r)).join('')||'\u003cp class=\"small-note\"\u003e这个原型中的信物已全部解锁。旧物仍有各自适合的开局。\u003c/p\u003e'}\u003c/div\u003e\u003cdiv class=\"inline-hint\"\u003e重新开局不会清空解锁记录，也不会提高总分上限。新的物件提供不同的故事，不把所有效果叠加给下一家。\u003c/div\u003e`;}\nfunction setupReview(){const errors=validateDraft(),b=draftEstimate(),l=draft.members.find(m=\u003em.id===draft.leader);return `\u003ch1 class=\"page-title\"\u003e家谱的第一页，由你落笔。\u003c/h1\u003e\u003cp class=\"intro-copy\"\u003e设定不会预先保证成功。家族接下来成为什么，取决于每个人如何生活。\u003c/p\u003e\u003cdiv class=\"first-page\"\u003e\u003cdiv class=\"eyebrow\"\u003e大晟历 ${draft.calendar} 年 · ${by(ERA,draft.era).name}\u003c/div\u003e\u003ch2\u003e${esc(draft.family||'未名')}氏 · 初记\u003c/h2\u003e\u003cp\u003e${by(ORIGINS,draft.origin).name}出身，${draft.members.length}位家人在${by(PLACES,draft.place).short}安了家。手中有${draft.money}两银钱，仓里有${draft.grain}石粮。\u003c/p\u003e\u003cp\u003e${esc(l?.name||'尚待选定的人')}将主持家中的共同事务。其他家人各有安排，也各有自己的前途。\u003c/p\u003e\u003cp\u003e${draft.relics.length?'带来的旧物有'+draft.relics.map(id=\u003erelicDef(id).name).join('、')+'。它们的来处，也许会在后来慢慢清楚。':'这一回没有带着特别的旧物。从今天起发生的事情，也值得后来的人记住。'}\u003c/p\u003e\u003cp\u003e从这一年起，开始写下这个家的日子。\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"review-lines\"\u003e\u003cdiv\u003e\u003cspan\u003e成员安排\u003c/span\u003e\u003cb\u003e${draft.members.map(m=\u003eesc(m.name)+' · '+JOBS[m.job].name).join('\u003cbr\u003e')}\u003c/b\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003e家风与人情\u003c/span\u003e\u003cb\u003e${by(HABITS,draft.habit).name}／${by(TIES,draft.tie).name}\u003c/b\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan\u003e首年家计\u003c/span\u003e\u003cb\u003e生产 ${b.income} 两 − 培养 ${b.training} 两 − 日常 ${b.upkeep} 两${b.foodCost?' − 购粮 '+b.foodCost+' 两':''}\u003cbr\u003e\u003cspan class=\"${b.money\u003e=0?'positive':'negative'}\"\u003e预计结余 ${signed(b.money)} 两\u003c/span\u003e。不含你之后处理的事件 .alive&&adults().length?'选择新族长':state.events.length?'先处理眼前的家事':'按安排，度过这一年');return `\u003cfooter class=\"yearbar\"\u003e\u003cdiv\u003e\u003cdiv class=\"yearbar-title\"\u003e${title}\u003c/div\u003e\u003cdiv class=\"yearbar-sub\"\u003e${sub}\u003c/div\u003e\u003c/div\u003e\u003cbutton class=\"advance-btn\" id=\"advance-year\" onclick=\"advanceYear()\"\u003e${action}\u003cspan class=\"arrow\"\u003e→\u003c/span\u003e\u003c/button\u003e\u003c/footer\u003e`;}\nfunction worldStrip(){return `\u003cdiv class=\"game-world-strip\"\u003e\u003cdiv\u003e\u003cspan class=\"calendar\"\u003e大晟历 ${state.calendar+state.elapsed} 年\u003c/span\u003e　${tag(by(ERA,state.era).name,'outline')}\u003c/div\u003e\u003cdiv class=\"quick-facts\"\u003e${tag(by(ORIGINS,state.config.origin).name)}${tag('已经营 '+state.elapsed+' 年')}${tag('开局 '+totalPoints(state.config)+' 点')}\u003c/div\u003e\u003c/div\u003e`;}\nfunction overviewView(){const b=estimate(state),l=get(state.leader),headline=state.ended?'这一家人的日子，留在了家谱里。':state.elapsed===0?'从这一年，慢慢过成一个家。':state.lastSummary?.deaths?'有人离开，也有人接过担子。':state.metrics.stable===0?'日子紧一些，还可以重新安排。':'又过了一年，家里有了些变化。';const ready=state.ended?[]:readyEndings();return `${worldStrip()}\u003csection class=\"intro\"\u003e\u003cdiv class=\"eyebrow\"\u003e${state.ended?'本局终章':'家族第 '+(state.elapsed+1)+' 年 · 秋'}\u003c/div\u003e\u003ch1\u003e${headline}\u003c/h1\u003e\u003cp\u003e${state.elapsed===0?'看看每个人正在做什么，再处理眼前的家事。开局只是起点。':'看一看这一年的后文，再安排下一年的日子。'}\u003c/p\u003e\u003c/section\u003e${state.ended?`\u003cdiv class=\"end-banner\"\u003e\u003cdiv class=\"between\"\u003e\u003ch2\u003e${esc(state.ended.title)}\u003c/h2\u003e\u003cbutton class=\"btn\" onclick=\"showConclusion()\"\u003e阅读结局\u003c/button\u003e\u003c/div\u003e\u003cp\u003e本轮已结束；不会再推进或改动人物。\u003c/p\u003e\u003c/div\u003e`:ready.length?`\u003cdiv class=\"followup\" style=\"margin-bottom:22px\"\u003e已经具备 ${ready.length} 条终章的落笔资格。你可以继续经营，也可以选择一个家族结局。\u003cbutton class=\"text-btn\" onclick=\"navigate('endings')\" style=\"margin-left:10px\"\u003e看看走到了哪里 →\u003c/button\u003e\u003c/div\u003e`:''}\u003csection class=\"stats\"\u003e\u003cdiv class=\"stat\"\u003e\u003cdiv class=\"stat-label\"\u003e在世族人\u003c/div\u003e\u003cdiv class=\"stat-value\"\u003e${living().length}\u003csmall\u003e人\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"stat-note\"\u003e家谱已至第 ${Math.max(...state.members.map(m=\u003em.gen))} 代\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"stat\"\u003e\u003cdiv class=\"stat-label\"\u003e家中积蓄\u003c/div\u003e\u003cdiv class=\"stat-value\"\u003e${fmt(state.money)}\u003csmall\u003e两\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"stat-note\"\u003e预计 \u003cspan class=\"${b.money\u003e=0?'positive':'negative'}\"\u003e${signed(b.money)} 两／年\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"stat\"\u003e\u003cdiv class=\"stat-label\"\u003e存粮\u003c/div\u003e\u003cdiv class=\"stat-value\"\u003e${fmt(state.grain)}\u003csmall\u003e石\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"stat-note\"\u003e全家每年吃用 ${b.eat} 石\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"stat\"\u003e\u003cdiv class=\"stat-label\"\u003e乡里声望\u003c/div\u003e\u003cdiv class=\"stat-value\"\u003e${state.reputation}\u003csmall\u003e/100\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"stat-note\"\u003e${state.reputation\u003e=70?'乡邻愿意来敲这扇门':'从来往与相处中积累'}\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\u003cdiv class=\"dash\"\u003e\u003cdiv class=\"stack\"\u003e${state.events.length&&!state.ended?decisionView():settledView()}\u003csection class=\"panel\"\u003e\u003cdiv class=\"panel-head\"\u003e\u003ch2\u003e家里近来\u003c/h2\u003e\u003cbutton class=\"text-btn\" onclick=\"navigate('history')\"\u003e翻阅年鉴 ↗\u003c/button\u003e\u003c/div\u003e\u003cdiv class=\"timeline\"\u003e${state.logs.slice(-3).reverse().map(timelineItem).join('')}\u003c/div\u003e\u003c/section\u003e\u003cdiv class=\"family-route\"\u003e\u003cdiv class=\"between\"\u003e\u003cspan class=\"small\"\u003e这一回，留下了什么？\u003c/span\u003e\u003cbutton class=\"text-btn\" onclick=\"navigate('relics')\"\u003e看看传家旧物 →\u003c/button\u003e\u003c/div\u003e\u003cp\u003e${state.relics.some(r=\u003er.phase===1&&r.status!=='sold')?'有人正在查访旧物的来处。新的消息，会在时间推进后送到。':'一些东西在家里传过几双手，慢慢就有了自己的故事。'}\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"stack\"\u003e${leaderCard(l)}\u003csection class=\"panel\"\u003e\u003cdiv class=\"panel-head\"\u003e\u003ch2\u003e每个人的安排\u003c/h2\u003e\u003cbutton class=\"text-btn\" onclick=\"navigate('members')\"\u003e全部 ${living().length} 人 ↗\u003c/button\u003e\u003c/div\u003e\u003cdiv class=\"roster\"\u003e${living().slice(0,5).map(m=\u003e`\u003cbutton class=\"roster-person\" onclick=\"openMember(${m.id})\"\u003e\u003cspan class=\"name-stamp\"\u003e${esc(m.name.slice(-1))}\u003c/span\u003e\u003cspan class=\"person-summary\"\u003e\u003cstrong\u003e${esc(m.name)}\u003c/strong\u003e\u003csmall\u003e${m.age}岁\u003c/small\u003e\u003cp\u003e${JOBS[m.job].name} · ${TALENTS[m.talent-1].name}资质\u003c/p\u003e\u003c/span\u003e\u003cspan class=\"chevron\"\u003e›\u003c/span\u003e\u003c/button\u003e`).join('')}\u003c/div\u003e\u003cdiv class=\"roster-foot\"\u003e主业持续保留；转行与接任由你决定。\u003c/div\u003e\u003c/section\u003e\u003cdiv class=\"overview-advice\"\u003e${state.relics.some(r=\u003er.phase===1)?'信物调查不会替换人物主业。下一年既结算生活，也继续调查。':'换族长不重置其他人。信物解锁跨局保留，但点数上限不会增长。'}\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e`;}\nfunction leaderCard(m){const cur=state.leaders.at(-1);return `\u003csection class=\"panel leader\"\u003e\u003cdiv class=\"between\"\u003e\u003cdiv class=\"leader-label\"\u003e现任族长\u003c/div\u003e${tag('第 '+state.leaders.length+' 任','outline')}\u003c/div\u003e\u003cdiv class=\"leader-name\"\u003e${m?.alive?esc(m.name):'虚位以待'}${m?.alive?`\u003csmall\u003e${m.age}岁\u003c/small\u003e`:''}\u003c/div\u003e\u003cdiv class=\"leader-era\"\u003e${m?.alive?'第 '+(cur.start+1)+' 年接任 · 已主事 '+(state.elapsed-cur.start)+' 年':'换一任族长，家里的日子继续。'}\u003c/div\u003e\u003cdiv class=\"leader-trait\"\u003e${m?.alive?'主持家中共同事务，也继续自己的'+JOBS[m.job].name+'。':'没有成年族人时，暂由家人共同照料。孩子长大后可以接任。'}\u003cbr\u003e\u003cstrong\u003e不因换任重置关系、安排或信物。\u003c/strong\u003e\u003c/div\u003e\u003cdiv class=\"leader-btns\"\u003e\u003cbutton class=\"btn\" onclick=\"openLeader()\" ${state.ended?'disabled':''}\u003e${m?.alive?'更换族长':'选择族长'}\u003c/button\u003e${m?.alive?`\u003cbutton class=\"btn\" onclick=\"openMember(${m.id})\"\u003e查看这个人\u003c/button\u003e`:''}\u003c/div\u003e\u003c/section\u003e`;}\nfunction decisionView(){const e=state.events[0],d=eventData(e);if(!d)return settledView();return `\u003csection class=\"panel decision\" id=\"decision\"\u003e\u003cdiv class=\"panel-head\"\u003e\u003ch2\u003e${e.type.startsWith('relic')?'一件旧物，有了新的线索':'有件家事，等你决定'}\u003c/h2\u003e${tag('待决定 · '+state.events.length,'red')}\u003c/div\u003e\u003cdiv class=\"panel-body\"\u003e\u003ch3 class=\"decision-title\"\u003e${esc(d.title)}\u003c/h3\u003e\u003cp class=\"letter\"\u003e${esc(d.body)}\u003c/p\u003e\u003cdiv class=\"event-source\"\u003e${esc(d.source)}\u003c/div\u003e${d.actorSelectable?`\u003clabel class=\"actor-field\"\u003e这件事交给谁来办\u003cselect id=\"event-actor\" onchange=\"chooseActor(this.value)\"\u003e${adults().map(m=\u003e`\u003coption value=\"${m.id}\" ${(e.actor||d.actor||state.leader)===m.id?'selected':''}\u003e${esc(m.name)} · ${JOBS[m.job].name}\u003c/option\u003e`).join('')||'\u003coption\u003e目前没有成年族人\u003c/option\u003e'}\u003c/select\u003e\u003c/label\u003e`:'\u003cdiv style=\"height:16px\"\u003e\u003c/div\u003e'}\u003cdiv class=\"choice-list\"\u003e${d.choices.map((o,i)=\u003e`\u003cbutton class=\"choice ${activeEventChoice===i?'selected':''}\" onclick=\"chooseEvent(${i})\" aria-pressed=\"${activeEventChoice===i}\" ${!affordable(o)?'disabled':''} data-event-choice=\"${i}\"\u003e\u003cspan class=\"choice-mark\"\u003e\u003c/span\u003e\u003cspan\u003e\u003cspan class=\"choice-title\"\u003e${esc(o.label)}\u003c/span\u003e\u003cdiv class=\"choice-desc\"\u003e${esc(o.desc)}${!affordable(o)?'（当前储备不足）':''}\u00 ap(x=\u003e`\u003cbutton class=\"tab ${memberFilter===x[0]?'active':''}\" onclick=\"memberFilter='${x[0]}';render()\"\u003e${x[1]}\u003c/button\u003e`).join('')}\u003c/div\u003e\u003cinput class=\"search\" aria-label=\"查找族人\" placeholder=\"按姓名查找…\" value=\"${esc(memberQuery)}\" oninput=\"searchPeople(this.value)\"\u003e\u003c/div\u003e\u003csection class=\"panel table-wrap\" id=\"people-table\"\u003e${membersTable()}\u003c/section\u003e\u003cdiv class=\"between\" style=\"margin-top:20px\"\u003e\u003cp class=\"small-note\"\u003e已故者的人生不会从家谱中消失。族长也有自己的主业。\u003c/p\u003e\u003cbutton class=\"btn small\" onclick=\"openAdoption()\" ${state.ended?'disabled':''}\u003e照料一位新家人\u003c/button\u003e\u003c/div\u003e`;}\nfunction membersTable(){const ms=state.members.filter(m=\u003e(memberFilter==='dead'?!m.alive:m.alive)&&(memberFilter==='adults'?m.age\u003e=18:memberFilter==='children'?m.age\u003c18:true)&&m.name.includes(memberQuery));return ms.length?`\u003ctable class=\"member-table\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e族人\u003c/th\u003e\u003cth\u003e年龄／辈分\u003c/th\u003e\u003cth\u003e长期安排\u003c/th\u003e\u003cth\u003e资质与倾向\u003c/th\u003e\u003cth\u003e\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e${ms.map(m=\u003e`\u003ctr class=\"${m.alive?'':'dead'}\"\u003e\u003ctd\u003e\u003cdiv class=\"row\"\u003e\u003cspan class=\"name-stamp\"\u003e${esc(m.name.slice(-1))}\u003c/span\u003e\u003cdiv\u003e\u003cspan class=\"person-name\"\u003e${esc(m.name)}\u003c/span\u003e ${m.id===state.leader?tag('族长','red'):''}\u003cdiv class=\"relation\"\u003e${esc(personRelation(m))}\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/td\u003e\u003ctd\u003e${m.age} 岁\u003cdiv class=\"job-sub\"\u003e第 ${m.gen} 代\u003c/div\u003e\u003c/td\u003e\u003ctd\u003e${m.alive?JOBS[m.job].name:'人生已落笔'}\u003cdiv class=\"job-sub\"\u003e${m.alive?'已累计 '+(m.jobYears[m.job]||0)+' 年':'第 '+(m.deathYear+1)+' 年离世'}\u003c/div\u003e\u003c/td\u003e\u003ctd\u003e${tag(TALENTS[m.talent-1].name)}\u003cdiv class=\"job-sub\"\u003e${FOCUSES[m.focus]}\u003c/div\u003e\u003c/td\u003e\u003ctd\u003e\u003cbutton class=\"btn small\" onclick=\"openMember(${m.id})\"\u003e${m.alive&&!state.ended?'查看与安排':'翻阅人生'} →\u003c/button\u003e\u003c/td\u003e\u003c/tr\u003e`).join('')}\u003c/tbody\u003e\u003c/table\u003e`:'\u003cdiv class=\"empty\"\u003e这里暂时没有符合条件的族人。\u003c/div\u003e';}\nfunction searchPeople(value){memberQuery=value;$('#people-table').innerHTML=membersTable();}\nfunction leadersView(){return `${pageHead('这个家，不止一任人来撑','历任族长','可以主动交接，也可以在离世之后选任。每一任都在同一局家族人生里。',`\u003cbutton class=\"btn primary\" onclick=\"openLeader()\" ${state.ended?'disabled':''}\u003e选择新族长\u003c/button\u003e`)}\u003cdiv class=\"notice\"\u003e任意在世、年满 18 岁的家族成员都可以接任，不限性别与支系。前任至少实际主持一年，才计入终章所需的真实交接；同年轮流任命不会刷出传承。\u003c/div\u003e\u003cdiv class=\"successions\"\u003e${state.leaders.map((h,i)=\u003e{const m=get(h.id);return `\u003carticle class=\"panel success-card\"\u003e\u003cdiv class=\"ordinal\"\u003e${String(i+1).padStart(2,'0')}\u003csmall\u003e第 ${i+1} 任\u003c/small\u003e\u003c/div\u003e\u003cdiv\u003e\u003ch2\u003e${esc(m.name)} ${h.end==null?tag('现任','green'):''}\u003c/h2\u003e\u003cp\u003e${esc(h.reason)}\u003c/p\u003e\u003cdiv class=\"tenure\"\u003e第 ${h.start+1} 年 — ${h.end==null?'至今':'第 '+(h.end+1)+' 年'} · ${m.alive?'在世，'+m.age+' 岁':'享年 '+m.age+' 岁'}\u003c/div\u003e\u003c/div\u003e\u003cbutton class=\"btn small\" onclick=\"openMember(${m.id})\"\u003e查看人生 →\u003c/button\u003e\u003c/article\u003e`}).join('')}\u003c/div\u003e`;}\nfunction historyView(){const years=[...new Set(state.logs.map(l=\u003el.year))].sort((a,b)=\u003eb-a);return `${pageHead('人来人往，总有记载','家族年鉴','安排、选择、解锁与后来发生的事，都在这里。',tag(state.logs.length+' 则记事','outline'))}${years.map(y=\u003e`\u003csection class=\"history-group\"\u003e\u003cdiv class=\"history-year\"\u003e第 ${y+1} 年\u003csmall\u003e大晟历 ${state.calendar+y} 年\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"panel\"\u003e\u003cdiv class=\"timeline\" style=\"padding-top:20px\"\u003e${state.logs.filter(l=\u003el.year===y).reverse().map(timelineItem).join('')}\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e`).join('')}`;}\nfunction estateView(){const b=estimate(state);return `${pageHead('收入有来处，支出也有去处','家业账本','这里先管理全家的共同资产。个人独立财产与异地支系账目留待后续实现。')}${worldStrip()}\u003cdiv class=\"dash\"\u003e\u003cdiv class=\"stack\"\u003e\u003csection class=\"panel\"\u003e\u003cdiv class=\"panel-head\"\u003e\u003ch2\u003e照当前安排，过这一年\u003c/h2\u003e${tag('预计收支','outline')}\u003c/div\u003e\u003cdiv class=\"mini-ledger\"\u003e\u003cdiv class=\"between\"\u003e\u003cspan\u003e生产与谋生所得\u003c/span\u003e\u003cspan class=\"positive\"\u003e+${b.income} 两\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"between\"\u003e\u003cspan\u003e读书、学艺等培养\u003c/span\u003e\u003cspan\u003e−${b.training} 两\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"between\"\u003e\u003cspan\u003e生活、住宅与租金\u003c/span\u003e\u003cspan\u003e−${b.upkeep} 两\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"between\"\u003e\u003cspan\u003e预计补买口粮\u003c/span\u003e\u003cspan\u003e−${b.foodCost} 两\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"between\"\u003e\u003cspan\u003e预计年度净结余\u003c/span\u003e\u003cspan class=\"${b.money\u003e=0?'positive':'negative'}\"\u003e${signed(b.money)} 两\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\u003cdiv class=\"ledger-assets\"\u003e\u003carticle class=\"panel\"\u003e\u003ch3\u003e${state.land} 亩田地\u003c/h3\u003e\u003cp\u003e每年额外收粮 ${state.land*4} 石。田产之外，务农族人仍有各自的收成。\u003c/p\u003e\u003cbutton class=\"btn small\" onclick=\"confirmPurchase('land')\" ${state.ended?'disabled':''}\u003e置一亩田 · 60 两\u003c/button\u003e\u003c/article\u003e\u003carticle class=\"panel\"\u003e\u003ch3\u003e${by(HOMES,state.home).name}\u003c/h3\u003e\u003cp\u003e${by(HOMES,state.home).desc}\u003c/p\u003e\u003cbutton class=\"btn small\" onclick=\"confirmPurchase('home')\" ${state.ended||state.home==='courtyard'||state.home==='estate'?'disabled':''}\u003e安置小院 · 100 两\u003c/
