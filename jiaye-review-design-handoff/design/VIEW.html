<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家业 · 手机设计稿浏览</title><link rel="stylesheet" href="../assets/handbook.css"><style>
.gallery-shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 94px)}.gallery-menu{border-right:1px solid var(--line);padding:24px 17px;background:#eeeee5}.menu-title{font-size:11px;letter-spacing:2px;color:var(--muted);margin:0 8px 15px}.design-item{width:100%;display:block;text-align:left;border:1px solid transparent;border-radius:8px;background:none;padding:13px 12px;margin-bottom:6px;font:14px/1.6 var(--sans)}.design-item small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.design-item.active{background:var(--card);border-color:var(--line);color:var(--green)}.gallery-stage{min-width:0;padding:28px 28px 70px}.gallery-stage h1{font-size:25px;margin:10px 0 9px}.gallery-note{max-width:800px;font-size:13px;color:var(--muted);margin:8px 0}.stage-top{max-width:1000px;margin:auto}.stage-tools{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin:20px 0}.size-buttons{display:flex;gap:6px;flex-wrap:wrap}.size-buttons .button{min-height:38px}.size-buttons .active{background:var(--green);color:#fff;border-color:var(--green)}.image-pad{background:#e4e8dd;border:1px solid #d0d8c9;border-radius:12px;padding:28px;display:flex;justify-content:center;align-items:flex-start;max-width:1000px;margin:auto;overflow:auto}.image-pad img{display:block;width:390px;max-width:100%;height:auto;box-shadow:0 15px 50px #25372b25;border-radius:3px}.image-pad.board img{width:100%;max-width:1100px}.below{text-align:center;font-size:12px;color:var(--muted);margin:12px 0}.gallery-foot{max-width:1000px;margin:25px auto 0;font-size:13px}@media(max-width:760px){.gallery-shell{display:block}.gallery-menu{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;border-right:0;border-bottom:1px solid var(--line)}.menu-title{display:none}.design-item{width:auto;min-width:160px;margin:0;flex-shrink:0;padding:10px;font-size:12px}.design-item small{font-size:10px}.gallery-stage{padding:22px 16px 45px}.gallery-stage h1{font-size:22px}.image-pad{padding:12px}.stage-tools{margin:15px 0}.gallery-note{font-size:12px}}
</style></head><body><header class="site"><a class="brand" href="../START_HERE.html">家业<small>手机设计稿 / STATIC DESIGN</small></a><div class="actions"><a class="button" href="../docs/02-手机逐屏与数值绑定.html">逐屏实现说明</a><a class="button" href="../START_HERE.html">返回目录</a></div></header><main class="gallery-shell"><nav class="gallery-menu" aria-label="设计稿选择"><div class="menu-title">8 份视觉资料 / 4 张独立竖屏</div><button class="design-item active" data-index="0">随机开局 · 一屏核对<small>UI-A01 · 静态结构稿</small></button><button class="design-item " data-index="1">家族主页 · 家事与家谱<small>UI-C01 · 静态结构稿</small></button><button class="design-item " data-index="2">人物详情 · 概况与安排<small>UI-C03 · 静态结构稿</small></button><button class="design-item " data-index="3">事件面板 · 决定与后续<small>UI-D02 · 静态结构稿</small></button><button class="design-item " data-index="4">最新手机关键界面 · 综合概念稿<small>BOARD-LATEST · 生成式概念稿</small></button><button class="design-item " data-index="5">随机开局 · 多状态板<small>BOARD-A · 静态状态板</small></button><button class="design-item " data-index="6">用户提供的同类 UI 参考<small>REFERENCE · 外部布局参考</small></button><button class="design-item " data-index="7">早期流程稿 · 已归档<small>ARCHIVE · 已被后续修订</small></button></nav><section class="gallery-stage"><div class="stage-top"><span class="pill" id="status">静态结构稿</span><h1 id="screen-title"></h1><p class="gallery-note" id="screen-note"></p><p class="gallery-note"><strong>这是静态稿浏览器，画面内按钮不可操作。</strong>数字与人物为示例；下面的宽度按钮只缩放图片，不代表已完成手机适配。</p><div class="stage-tools"><div class="size-buttons" id="sizes"><button class="button" data-size="360">360 展示</button><button class="button active" data-size="390">390 展示</button><button class="button" data-size="430">430 展示</button></div><div class="actions"><button class="button" id="prev">← 上一张</button><button class="button" id="next">下一张 →</button><a class="button primary" id="original" href="screens/A01-opening-390.png" target="_blank" rel="noopener">打开原图 ↗</a></div></div></div><div class="image-pad" id="image-pad"><img id="screen-image" src="screens/A01-opening-390.png" alt="随机家族开局静态设计稿"></div><div class="below" id="dimension"></div><div class="gallery-foot"><div class="callout">最新综合海报用于美术和模块方向；独立竖屏稿用于结构参考。固定姓氏、图片示例数值、未注册信物都不得写死到游戏。</div><div class="actions"><a class="button" href="../docs/06-设计稿使用与已知差异.html">设计稿差异与使用边界</a><a class="button" href="../baseline/v5/prototype/jiaye-v5-mobile-preview.html">打开旧版 V5 互动基线</a></div></div></section></main><script>
const screens=[{"id": "UI-A01", "title": "随机开局 · 一屏核对", "path": "screens/A01-opening-390.png", "category": "screen", "status": "静态结构稿", "note": "姓名可编辑/单独随机；换一家是整户生成。截图中的家庭和数值仅为示例。"}, {"id": "UI-C01", "title": "家族主页 · 家事与家谱", "path": "screens/C01-home-390.png", "category": "screen", "status": "静态结构稿", "note": "家事优先；家谱中的每个人可进入详情。不是把全员操作缩成只有族长。"}, {"id": "UI-C03", "title": "人物详情 · 概况与安排", "path": "screens/C03-member-390.png", "category": "screen", "status": "静态结构稿", "note": "潜力、能力、健康分开；操作反馈与保存须在真实界面实现。"}, {"id": "UI-D02", "title": "事件面板 · 决定与后续", "path": "screens/D02-event-390.png", "category": "screen", "status": "静态结构稿", "note": "执行人、费用、等待和结果绑定事件实例；不能只用通用计时器换物件名。"}, {"id": "BOARD-LATEST", "title": "最新手机关键界面 · 综合概念稿", "path": "concepts/01-latest-mobile-storyboard.png", "category": "board", "status": "生成式概念稿", "note": "用于方向与信息层级；文字、信物和数值不可直接作为规则配置。"}, {"id": "BOARD-A", "title": "随机开局 · 多状态板", "path": "boards/A-random-opening.png", "category": "board", "status": "静态状态板", "note": "多种家庭是生成结果示意，不是固定家族轮播。"}, {"id": "REFERENCE", "title": "用户提供的同类 UI 参考", "path": "reference/user-ui-reference.png", "category": "reference", "status": "外部布局参考", "note": "只研究布局，不能直接复制角色、图标、字体或修仙玩法。"}, {"id": "ARCHIVE", "title": "早期流程稿 · 已归档", "path": "archive/00-earlier-storyboard.png", "category": "archive", "status": "已被后续修订", "note": "固定林家等表现已废弃；只记录设计演变。"}];
let index=0,size=390;
const $=q=>document.querySelector(q);
function show(i){index=(i+screens.length)%screens.length;const s=screens[index];$('#screen-title').textContent=s.title;$('#status').textContent=s.status;$('#screen-note').textContent=s.note;$('#screen-image').src=s.path;$('#screen-image').alt=s.title+'（静态设计稿）';$('#original').href=s.path;const board=s.category!=='screen';$('#image-pad').classList.toggle('board',board);$('#screen-image').style.width=board?'100%':size+'px';$('#sizes').hidden=board;document.querySelectorAll('.design-item').forEach((e,n)=>{e.classList.toggle('active',n===index);e.setAttribute('aria-pressed',String(n===index));});}
$('#screen-image').addEventListener('load',()=>{const im=$('#screen-image');$('#dimension').textContent='原图 '+im.naturalWidth+' × '+im.naturalHeight+' px'+(screens[index].category==='screen'?' · 逻辑参考 390 × 844（2×导出）':' · 原图保留');});
document.querySelectorAll('.design-item').forEach(e=>e.addEventListener('click',()=>show(Number(e.dataset.index))));
document.querySelectorAll('[data-size]').forEach(e=>e.addEventListener('click',()=>{size=Number(e.dataset.size);document.querySelectorAll('[data-size]').forEach(b=>b.classList.toggle('active',b===e));show(index);}));
$('#prev').addEventListener('click',()=>show(index-1));$('#next').addEventListener('click',()=>show(index+1));
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight')show(index+1);if(e.key==='ArrowLeft')show(index-1);});show(0);
</script></body></html>
